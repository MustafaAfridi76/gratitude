<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1a14">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The requested Gratitude page could not be found. Return home or explore coaching and wellbeing support.">
    <title>Page Not Found | Gratitude</title>
    <link rel="icon" href="/assets/images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html { background: #07100a; color-scheme: dark; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 32px; overflow-x: hidden; background: radial-gradient(circle at 72% 24%, rgba(194,142,24,.16), transparent 28%), #07100a; color: #fffaf4; font-family: "DM Sans", sans-serif; }
      main { width: min(760px, 100%); min-width: 0; }
      img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 18px 30px rgba(0,0,0,.25)); }
      .eyebrow { margin: 50px 0 14px; color: #d9b04a; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      h1 { max-width: 680px; margin: 0; font: 400 clamp(68px, 12vw, 132px)/.82 "Newsreader", serif; }
      p { max-width: 570px; margin: 34px 0; color: rgba(255,250,244,.68); font-size: 16px; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { min-height: 48px; padding: 0 18px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 3px; color: #fffaf4; text-decoration: none; font-weight: 600; }
      a:first-child { border-color: rgba(217,176,74,.7); background: linear-gradient(110deg, #c28e18, #805814); }
      a:focus-visible { outline: 2px solid #d9b04a; outline-offset: 4px; }
      @media (max-width: 600px) {
        body { place-items: center start; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); }
        main { width: calc(100vw - 48px); }
        h1 { font-size: clamp(58px, 17vw, 76px); }
        nav { display: grid; grid-template-columns: 1fr; }
        a { width: 100%; justify-content: center; text-align: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/images/logo.png" width="1080" height="1080" alt="Gratitude">
      <p class="eyebrow">404 / Page not found</p>
      <h1>This path ends here.</h1>
      <p>The page may have moved or the address may be incomplete. Return to Gratitude or continue to coaching services and booking.</p>
      <nav aria-label="Page not found navigation">
        <a href="/">Return home</a>
        <a href="/#services">Explore coaching services</a>
        <a href="/#book">Book a coaching session</a>
      </nav>
    </main>
  </body>
</html>
